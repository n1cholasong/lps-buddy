<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ration Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body onload="initializeDefaults()">
  <div class="container mt-4">
    <h2 class="text-center">Ration Report</h2>
    
    <label class="form-label">Date:</label>
    <input type="text" id="date" class="form-control" readonly>
    
    <label class="form-label">Meal Type:</label>
    <select id="mealType" class="form-select">
      <option value="LUNCH">LUNCH</option>
      <option value="DINNER">DINNER</option>
      <option value="BREAKFAST">BREAKFAST</option>
    </select>
    
    <h5 class="mt-3">Daily Ration Reporting</h5>
    <div class="counter-group">
      <label class="form-label">NM:</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('nm', -1, 27)">-</button>
        <input type="text" id="nm" class="form-control text-center" value="27" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('nm', 1, 27)">+</button>
      </div>
    </div>
    <div class="counter-group">
      <label class="form-label">M:</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('m', -1, 2)">-</button>
        <input type="text" id="m" class="form-control text-center" value="2" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('m', 1, 2)">+</button>
      </div>
    </div>
    <div class="counter-group">
      <label class="form-label">VI:</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('vi', -1, 1)">-</button>
        <input type="text" id="vi" class="form-control text-center" value="1" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('vi', 1, 1)">+</button>
      </div>
    </div>
    <div class="counter-group">
      <label class="form-label">VC:</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('vc', -1, 0)">-</button>
        <input type="text" id="vc" class="form-control text-center" value="0" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('vc', 1, 0)">+</button>
      </div>
    </div>
    <div class="counter-group">
      <label class="form-label">NMSD:</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('nmsd', -1, 1)">-</button>
        <input type="text" id="nmsd" class="form-control text-center" value="1" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('nmsd', 1, 1)">+</button>
      </div>
    </div>
    
    <label class="form-label mt-3">Remarks:</label>
    <textarea id="remarks" class="form-control" placeholder="Any additional remarks..."></textarea>
    
    <button class="btn btn-success w-100 mt-3" onclick="generateRationText()">Generate</button>
    <textarea id="output" class="form-control mt-3" readonly></textarea>
    <button class="btn btn-secondary w-100 mt-2" onclick="copyText()">Copy to Clipboard</button>
  </div>
  
  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
