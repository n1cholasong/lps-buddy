<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parade State Update</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body onload="initializeDefaults()">
  <div class="container mt-4">
    <h2 class="text-center">Parade State Update</h2>
    
    <label class="form-label">Date:</label>
    <input type="text" id="date" class="form-control">
    
    <label class="form-label">First/Last Parade:</label>
    <select id="paradeType" class="form-select">
      <option value="FIRST PARADE">First Parade</option>
      <option value="LAST PARADE">Last Parade</option>
    </select>
    
    <h5 class="mt-3">Current Strength:</h5>
    <div class="counter-group">
      <label class="form-label">SCT (RnS):</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('sctRns', -1, 14)">-</button>
        <input type="text" id="sctRns" class="form-control text-center" value="14" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('sctRns', 1, 14)">+</button>
      </div>
    </div>
    <div class="counter-group">
      <label class="form-label">OCT (RnS):</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('octRns', -1, 1)">-</button>
        <input type="text" id="octRns" class="form-control text-center" value="1" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('octRns', 1, 1)">+</button>
      </div>
    </div>
    
    <h5 class="mt-3">WLR:</h5>
    <div class="counter-group">
      <label class="form-label">SCT (WLR):</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('sctWlr', -1, 16)">-</button>
        <input type="text" id="sctWlr" class="form-control text-center" value="16" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('sctWlr', 1, 16)">+</button>
      </div>
    </div>
    
    <div class="counter-group mt-3">
      <label class="form-label">Reporting sick:</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('reportingSick', -1)">-</button>
        <input type="text" id="reportingSick" class="form-control text-center" value="0" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('reportingSick', 1)">+</button>
      </div>
    </div>
    <div class="counter-group mt-3">
      <label class="form-label">Attend B:</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('attendB', -1)">-</button>
        <input type="text" id="attendB" class="form-control text-center" value="0" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('attendB', 1)">+</button>
      </div>
    </div>
    <div class="counter-group mt-3">
      <label class="form-label">Attend C:</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('attendC', -1)">-</button>
        <input type="text" id="attendC" class="form-control text-center" value="0" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('attendC', 1)">+</button>
      </div>
    </div>
    
    <label class="form-label mt-3">Book out time:</label>
    <input type="time" id="bookOut" class="form-control" placeholder="e.g., 1730">
    
    <label class="form-label mt-3">Book in time:</label>
    <input type="time" id="bookIn" class="form-control" placeholder="e.g., 2200">
    
    <div class="counter-group mt-3">
      <label class="form-label">Out of camp:</label>
      <div class="input-group">
        <button class="btn btn-outline-secondary" onclick="adjustCounter('outOfCamp', -1, 30)">-</button>
        <input type="text" id="outOfCamp" class="form-control text-center" value="0" readonly>
        <button class="btn btn-outline-secondary" onclick="adjustCounter('outOfCamp', 1, 30)">+</button>
      </div>
    </div>
    
    <label class="form-label mt-3">OOC:</label>
    <input type="text" id="ooc" class="form-control" placeholder="OOC details (if any)">
    
    <label class="form-label mt-3">Lights out timing:</label>
    <input type="time" id="lightsOut" class="form-control" value="">
    
    <label class="form-label mt-3">Fall in timing:</label>
    <input type="time" id="fallIn" class="form-control" value="">
    
    <label class="form-label mt-3">Remarks:</label>
    <textarea id="remarks" class="form-control" placeholder="Any additional remarks..."></textarea>
    
    <button class="btn btn-success w-100 mt-3" onclick="generateParadeText()">Generate</button>
    <textarea id="output" class="form-control mt-3" readonly></textarea>
    <button class="btn btn-secondary w-100 mt-2" onclick="copyText()">Copy to Clipboard</button>
  </div>
  
  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
