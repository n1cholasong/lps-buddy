<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Timing Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container mt-4">
    <a href="index.html" class="text-primary text-decoration-none d-flex align-items-center mb-3">
      <i class="fa-solid fa-chevron-left"></i>
      <span class="ms-2">Home</span>
    </a>
    <div class="d-flex justify-content-between align-items-center">
      <h2>Next Timing</h2>
      <button class="btn btn-outline-secondary" id="toggleTheme">
        <i class="fa-solid fa-moon" style="color: orange;"></i>
      </button>
    </div>
    
    <label class="form-label mt-3">Time:</label>
    <input type="time" id="time" class="form-control" value="06:05">
    
    <label class="form-label mt-3">Activity:</label>
    <select id="activitySelect" class="form-select" onchange="toggleOtherActivity()">
      <option value="First Parade">First Parade</option>
      <option value="Last Parade">Last Parade</option>
      <option value="Breakfast">Breakfast</option>
      <option value="Lunch">Lunch</option>
      <option value="Dinner">Dinner</option>
      <option value="Draw Arms">Draw Arms</option>
      <option value="Send Arms">Send Arms</option>
      <option value="Draw Stores">Draw Stores</option>
      <option value="Send Stores">Send Stores</option>
      <option value="Other">Other</option>
    </select>
    <div id="otherActivityDiv" class="mt-2" style="display: none;">
      <input type="text" id="otherActivity" class="form-control" placeholder="Type activity here">
    </div>
    
    <label class="form-label mt-3">Venue:</label>
    <select id="venueSelect" class="form-select" onchange="toggleOtherVenue()">
      <option value="Outside Notus Garage">Outside Notus Garage</option>
      <option value="BattleKing Room">BattleKing Room</option>
      <option value="Foyer">Foyer</option>
      <option value="Armstoke">Armstoke</option>
      <option value="Other">Other</option>
    </select>
    <div id="otherVenueDiv" class="mt-2" style="display: none;">
      <input type="text" id="otherVenue" class="form-control" placeholder="Type venue here">
    </div>
    
    <label class="form-label mt-3">Attire:</label>
    <select id="attire" class="form-select">
      <option value="Smart 4">Smart 4</option>
      <option value="Long 4">Long 4</option>
      <option value="Hybrid">Hybrid</option>
      <option value="Vest Slack">Vest Slack</option>
      <option value="Admin">Admin</option>
      <option value="PT Kit">PT Kit</option>
    </select>
    
    <label class="form-label mt-3">Things to bring:</label>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="E-PACK" id="bringEp">
      <label class="form-check-label" for="bringEp">E-PACK</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="Water Bottle" id="bringWater">
      <label class="form-check-label" for="bringWater">Water Bottle</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="Thermometer" id="bringThermo">
      <label class="form-check-label" for="bringThermo">Thermometer</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="11B" id="bring11B">
      <label class="form-check-label" for="bring11B">11B</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="Polar Watch" id="bringWatch">
      <label class="form-check-label" for="bringWatch">Polar Watch</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="SAR21" id="bringSar21">
      <label class="form-check-label" for="bringSar21">SAR21</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="Helmet" id="bringHelmet">
      <label class="form-check-label" for="bringHelmet">Helmet</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="FAD" id="bringFAD">
      <label class="form-check-label" for="bringFAD">FAD</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="ID Tag" id="bringIdTag">
      <label class="form-check-label" for="bringIdTag">ID Tag</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="LBS" id="bringLBS">
      <label class="form-check-label" for="bringLBS">LBS</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="Assault Pack" id="bringAssaultPack">
      <label class="form-check-label" for="bringAssaultPack">Assault Bag</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="Field Pack" id="bringFieldPack">
      <label class="form-check-label" for="bringFieldPack">Field Pack</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" value="10-Pack" id="bring10Pack">
      <label class="form-check-label" for="bring10Pack">10-Pack</label>
    </div>
    
    <div class="form-check mt-3">
      <label class="form-check-label" for="safetyStores">Include Safety Stores?</label>
      <input class="form-check-input ms-3" type="checkbox" id="safetyStores">
    </div>
    
    <label for="remarks" class="form-label mt-3">Remarks:</label>
    <textarea id="remarks" class="form-control" placeholder="Enter remarks (if any)"></textarea>
    
    <button class="btn btn-success w-100 mt-3" onclick="generateNextTimingText()"><i class="fa-solid fa-gear"></i> Generate</button>
    <textarea id="output" class="form-control mt-3" readonly></textarea>
    <button class="btn btn-secondary w-100 mt-2" onclick="copyText()"><i class="fa-solid fa-copy"></i> Copy to Clipboard</button>
  </div>
  
  <script src="js/script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
